name: Credential expiry

# Fails (and opens an issue) when a credential in ops/credentials.json is within
# warn_days of its 90-day life, or past it. No cloud access needed: the date is
# the record that whoever rotates the key updates (see ops/ROTATE_GCP_KEY.md).
on:
  schedule:
    - cron: "0 14 * * 1"   # Mondays 14:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "ops/credentials.json"
      - "scripts/check-credential-age.ps1"
      - ".github/workflows/credential-expiry.yml"

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Credential age
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check credential age
        shell: pwsh
        run: ./scripts/check-credential-age.ps1

      - name: Open a rotation issue
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Rotate credentials (90-day limit)"
          if [ -z "$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')" ]; then
            gh issue create --title "$title" \
              --body "A credential in ops/credentials.json is due or overdue. Follow ops/ROTATE_GCP_KEY.md, then update created/key_id in ops/credentials.json. Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
